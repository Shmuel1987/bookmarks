<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bookmarks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="wrap">
    <header>
      <div class="header-controls">
        <button id="lang-toggle" class="theme-toggle" title="Switch language">
          <span id="lang-icon">🌐</span>
          <span id="lang-label">עברית</span>
        </button>
        <button id="theme-toggle" class="theme-toggle" title="Toggle light / dark theme">
          <span id="theme-icon">🌙</span>
          <span id="theme-label">Dark</span>
        </button>
      </div>
      <h1><span class="logo-emoji" aria-hidden="true"><svg viewBox="0 0 120 100" xmlns="http://www.w3.org/2000/svg">
        <rect x="4" y="86" width="112" height="10" rx="5" fill="#8b5e3c"/>
        <rect x="10" y="30" width="14" height="58" rx="4" fill="#ff6b6b"/>
        <rect x="26" y="18" width="14" height="70" rx="4" fill="#4ecdc4"/>
        <rect x="44" y="8" width="22" height="80" rx="5" fill="#ffd93d"/>
        <rect x="68" y="24" width="14" height="64" rx="4" fill="#6c5ce7"/>
        <rect x="84" y="34" width="14" height="54" rx="4" fill="#ff9f43"/>
        <circle cx="51" cy="27" r="4" fill="#2b2b2b"/>
        <circle cx="63" cy="27" r="4" fill="#2b2b2b"/>
        <circle cx="46" cy="33" r="3" fill="#ff9aa2" opacity="0.7"/>
        <circle cx="68" cy="33" r="3" fill="#ff9aa2" opacity="0.7"/>
        <path d="M49 37 Q55 47 61 37" stroke="#2b2b2b" stroke-width="3" fill="none" stroke-linecap="round"/>
      </svg></span> <span data-i18n="title">Bookmarks</span></h1>
      <p data-i18n="subtitle">Save links you care about, find them again in seconds.</p>
    </header>

    <section id="add-section" class="card">
      <h2 class="section-title" data-i18n="addSectionTitle">➕ Add a bookmark</h2>
      <form id="bookmark-form">
        <div class="field full">
          <label for="url" data-i18n="labelUrl">URL</label>
          <input type="url" id="url" data-i18n-placeholder="placeholderUrl" placeholder="https://example.com" required>
        </div>
        <div class="field full">
          <label for="title" data-i18n="labelTitle">Title</label>
          <input type="text" id="title" data-i18n-placeholder="placeholderTitle" placeholder="e.g. MDN Web Docs" required>
        </div>
        <div class="field">
          <label for="tag"><span data-i18n="labelTag">Tag</span> <span style="font-weight:400" data-i18n="optional">(optional)</span></label>
          <input type="text" id="tag" data-i18n-placeholder="placeholderTag" placeholder="e.g. Reading, Work">
        </div>
        <div class="field full">
          <label for="note"><span data-i18n="labelNote">Note</span> <span style="font-weight:400" data-i18n="optional">(optional)</span></label>
          <textarea id="note" data-i18n-placeholder="placeholderNote" placeholder="Why did you save this?"></textarea>
        </div>
        <div class="form-actions">
          <button type="reset" class="btn-ghost" data-i18n="clear">Clear</button>
          <button type="submit" class="btn-primary" data-i18n="save">Save bookmark</button>
        </div>
      </form>
    </section>

    <section id="view-section" class="card">
      <div class="section-header">
        <h2 class="section-title" style="margin:0;" data-i18n="viewSectionTitle">🔖 Your bookmarks</h2>
        <div class="search-box">
          <input type="text" id="search" data-i18n-placeholder="searchPlaceholder" placeholder="Search by title, URL, or tag...">
        </div>
        <select id="category-filter" class="category-filter">
          <option value="" data-i18n="allCategories">All categories</option>
        </select>
        <button type="button" id="group-toggle" class="btn-ghost" data-i18n="groupByCategory">Group by category</button>
        <span class="count-badge" id="count-badge">0</span>
      </div>
      <div class="bookmark-list" id="bookmark-list"></div>
    </section>
  </div>

  <div class="toast" id="toast"></div>

<script>
  const STORAGE_KEY = 'bookmarks-app-v2';
  const THEME_KEY = 'bookmarks-app-theme';
  const LANG_KEY = 'bookmarks-app-lang';

  const translations = {
    en: {
      title: 'Bookmarks',
      subtitle: 'Save links you care about, find them again in seconds.',
      addSectionTitle: '➕ Add a bookmark',
      labelUrl: 'URL',
      labelTitle: 'Title',
      labelTag: 'Tag',
      optional: '(optional)',
      labelNote: 'Note',
      placeholderUrl: 'https://example.com',
      placeholderTitle: 'e.g. MDN Web Docs',
      placeholderTag: 'e.g. Reading, Work',
      placeholderNote: 'Why did you save this?',
      clear: 'Clear',
      save: 'Save bookmark',
      viewSectionTitle: '🔖 Your bookmarks',
      searchPlaceholder: 'Search by title, URL, or tag...',
      allCategories: 'All categories',
      groupByCategory: 'Group by category',
      ungroup: 'Ungroup',
      countSaved: n => `${n} saved`,
      emptyNone: 'No bookmarks yet. Add your first one above!',
      emptyFiltered: 'No bookmarks match your filters.',
      open: 'Open',
      delete: 'Delete',
      toastSaved: 'Bookmark saved',
      toastDeleted: 'Bookmark deleted',
      uncategorized: 'Uncategorized',
      themeDark: 'Dark',
      themeLight: 'Light',
      themeToggleTitle: 'Toggle light / dark theme',
      langToggleTitle: 'Switch to Hebrew',
      langLabel: 'עברית'
    },
    he: {
      title: 'סימניות',
      subtitle: 'שמרו קישורים שחשובים לכם, ומצאו אותם שוב תוך שניות.',
      addSectionTitle: '➕ הוספת סימנייה',
      labelUrl: 'כתובת URL',
      labelTitle: 'כותרת',
      labelTag: 'תגית',
      optional: '(אופציונלי)',
      labelNote: 'הערה',
      placeholderUrl: 'https://example.com',
      placeholderTitle: 'לדוגמה: MDN Web Docs',
      placeholderTag: 'לדוגמה: קריאה, עבודה',
      placeholderNote: 'למה שמרתם את זה?',
      clear: 'ניקוי',
      save: 'שמירת סימנייה',
      viewSectionTitle: '🔖 הסימניות שלך',
      searchPlaceholder: 'חיפוש לפי כותרת, כתובת או תגית...',
      allCategories: 'כל הקטגוריות',
      groupByCategory: 'קיבוץ לפי קטגוריה',
      ungroup: 'ביטול קיבוץ',
      countSaved: n => `${n} נשמרו`,
      emptyNone: 'עדיין אין סימניות. הוסיפו את הראשונה למעלה!',
      emptyFiltered: 'אין סימניות התואמות את הסינון שלכם.',
      open: 'פתיחה',
      delete: 'מחיקה',
      toastSaved: 'הסימנייה נשמרה',
      toastDeleted: 'הסימנייה נמחקה',
      uncategorized: 'ללא קטגוריה',
      themeDark: 'כהה',
      themeLight: 'בהיר',
      themeToggleTitle: 'מעבר בין מצב בהיר/כהה',
      langToggleTitle: 'החלפה לאנגלית',
      langLabel: 'English'
    }
  };

  let lang = localStorage.getItem(LANG_KEY) || 'en';

  function t(key) {
    return translations[lang][key];
  }

  function applyLanguage() {
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === 'he' ? 'rtl' : 'ltr';

    document.querySelectorAll('[data-i18n]').forEach(el => {
      el.textContent = t(el.getAttribute('data-i18n'));
    });
    document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
      el.placeholder = t(el.getAttribute('data-i18n-placeholder'));
    });

    langLabelEl.textContent = t('langLabel');
    langToggleBtn.title = t('langToggleTitle');
    themeToggleBtn.title = t('themeToggleTitle');
    groupToggleBtn.textContent = groupByCategory ? t('ungroup') : t('groupByCategory');

    applyTheme(localStorage.getItem(THEME_KEY));
  }

  const langToggleBtn = document.getElementById('lang-toggle');
  const langLabelEl = document.getElementById('lang-label');

  langToggleBtn.addEventListener('click', () => {
    lang = lang === 'en' ? 'he' : 'en';
    localStorage.setItem(LANG_KEY, lang);
    applyLanguage();
    render();
  });

  const themeToggleBtn = document.getElementById('theme-toggle');
  const themeIcon = document.getElementById('theme-icon');
  const themeLabel = document.getElementById('theme-label');

  function systemPrefersDark() {
    return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  }

  function applyTheme(theme) {
    // theme is 'light', 'dark', or null (follow system)
    if (theme) {
      document.documentElement.setAttribute('data-theme', theme);
    } else {
      document.documentElement.removeAttribute('data-theme');
    }
    const isDark = theme ? theme === 'dark' : systemPrefersDark();
    themeIcon.textContent = isDark ? '☀️' : '🌙';
    themeLabel.textContent = isDark ? t('themeLight') : t('themeDark');
  }

  themeToggleBtn.addEventListener('click', () => {
    const current = localStorage.getItem(THEME_KEY) || (systemPrefersDark() ? 'dark' : 'light');
    const next = current === 'dark' ? 'light' : 'dark';
    localStorage.setItem(THEME_KEY, next);
    applyTheme(next);
  });

  const form = document.getElementById('bookmark-form');
  const urlInput = document.getElementById('url');
  const titleInput = document.getElementById('title');
  const tagInput = document.getElementById('tag');
  const noteInput = document.getElementById('note');
  const listEl = document.getElementById('bookmark-list');
  const searchEl = document.getElementById('search');
  const categoryFilterEl = document.getElementById('category-filter');
  const groupToggleBtn = document.getElementById('group-toggle');
  const countBadge = document.getElementById('count-badge');
  const toastEl = document.getElementById('toast');

  let bookmarks = loadBookmarks();
  let groupByCategory = false;

  function loadBookmarks() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch {
      return [];
    }
  }

  function saveBookmarks() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(bookmarks));
  }

  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => toastEl.classList.remove('show'), 1800);
  }

  function normalizeUrl(value) {
    try {
      return new URL(value).href;
    } catch {
      return new URL('https://' + value).href;
    }
  }

  function faviconFor(url) {
    try {
      const host = new URL(url).hostname;
      return `https://www.google.com/s2/favicons?sz=64&domain=${host}`;
    } catch {
      return '';
    }
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function categoryOf(b) {
    return b.tag && b.tag.trim() ? b.tag.trim() : t('uncategorized');
  }

  function renderCategoryOptions() {
    const categories = Array.from(new Set(bookmarks.map(categoryOf))).sort((a, b) => a.localeCompare(b));
    const current = categoryFilterEl.value;
    categoryFilterEl.innerHTML = `<option value="">${escapeHtml(t('allCategories'))}</option>` +
      categories.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('');
    if (categories.includes(current)) categoryFilterEl.value = current;
  }

  function bookmarkCard(b) {
    return `
        <div class="bookmark" data-id="${b.id}">
          <div class="favicon">
            <img src="${faviconFor(b.url)}" alt="" onerror="this.style.display='none'">
          </div>
          <div class="bookmark-body">
            <a class="bookmark-title" href="${escapeHtml(b.url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(b.title)}</a>
            <a class="bookmark-url" href="${escapeHtml(b.url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(b.url)}</a>
            ${b.note ? `<div class="bookmark-note">${escapeHtml(b.note)}</div>` : ''}
            ${b.tag ? `<span class="tag">${escapeHtml(b.tag)}</span>` : ''}
          </div>
          <div class="bookmark-actions">
            <button class="icon-btn visit" data-action="visit" data-url="${escapeHtml(b.url)}" title="${escapeHtml(t('open'))}">↗</button>
            <button class="icon-btn" data-action="delete" data-id="${b.id}" title="${escapeHtml(t('delete'))}">🗑</button>
          </div>
        </div>
      `;
  }

  function render() {
    renderCategoryOptions();

    const query = searchEl.value.trim().toLowerCase();
    const category = categoryFilterEl.value;
    const filtered = bookmarks.filter(b => {
      const matchesQuery = !query || (
        b.title.toLowerCase().includes(query) ||
        b.url.toLowerCase().includes(query) ||
        (b.tag && b.tag.toLowerCase().includes(query))
      );
      const matchesCategory = !category || categoryOf(b) === category;
      return matchesQuery && matchesCategory;
    });

    countBadge.textContent = t('countSaved')(bookmarks.length);

    if (filtered.length === 0) {
      listEl.innerHTML = `
        <div class="empty-state">
          <span class="emoji">${bookmarks.length === 0 ? '🗂️' : '🔍'}</span>
          ${bookmarks.length === 0 ? t('emptyNone') : t('emptyFiltered')}
        </div>`;
      return;
    }

    const ordered = filtered.slice().reverse();

    if (!groupByCategory) {
      listEl.innerHTML = ordered.map(bookmarkCard).join('');
      return;
    }

    const groups = new Map();
    for (const b of ordered) {
      const cat = categoryOf(b);
      if (!groups.has(cat)) groups.set(cat, []);
      groups.get(cat).push(b);
    }
    const sortedCats = Array.from(groups.keys()).sort((a, b) => a.localeCompare(b));

    listEl.innerHTML = sortedCats.map(cat => `
        <div class="category-group">
          <h3 class="category-heading">${escapeHtml(cat)} <span class="category-count">${groups.get(cat).length}</span></h3>
          ${groups.get(cat).map(bookmarkCard).join('')}
        </div>
      `).join('');
  }

  function deleteBookmark(id) {
    bookmarks = bookmarks.filter(b => b.id !== id);
    saveBookmarks();
    render();
    showToast(t('toastDeleted'));
  }

  listEl.addEventListener('click', (e) => {
    const btn = e.target.closest('[data-action]');
    if (!btn) return;
    if (btn.dataset.action === 'visit') {
      window.open(btn.dataset.url, '_blank');
    } else if (btn.dataset.action === 'delete') {
      deleteBookmark(btn.dataset.id);
    }
  });

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const url = normalizeUrl(urlInput.value.trim());
    const title = titleInput.value.trim();
    const tag = tagInput.value.trim();
    const note = noteInput.value.trim();

    if (!url || !title) return;

    bookmarks.push({
      id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now()),
      url,
      title,
      tag,
      note,
      createdAt: Date.now()
    });

    saveBookmarks();
    form.reset();
    render();
    showToast(t('toastSaved'));
  });

  searchEl.addEventListener('input', render);
  categoryFilterEl.addEventListener('change', render);

  groupToggleBtn.addEventListener('click', () => {
    groupByCategory = !groupByCategory;
    groupToggleBtn.classList.toggle('active', groupByCategory);
    groupToggleBtn.textContent = groupByCategory ? t('ungroup') : t('groupByCategory');
    render();
  });

  applyLanguage();
  render();
</script>
</body>
</html>
